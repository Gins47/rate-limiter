
events {}

http {
    # Define a rate limit of 50 requests/second per client IP
    limit_req_zone $binary_remote_addr zone=pricing_limit:10m rate=50r/s;

    upstream pricing_api {
        server provider:8001;
    }

    server {
        listen 80;

        location /prices/ {
            limit_req zone=pricing_limit burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://pricing_api;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://pricing_api;
        }
    }
}
